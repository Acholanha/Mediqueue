 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor & Staff Tasks - MediQueue Pro</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; color: #1e293b; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0f172a, #1d4ed8); padding: 15px 40px; color: white; }
        .navbar .logo { font-size: 24px; font-weight: bold; }
        .navbar a { color: #e2e8f0; text-decoration: none; margin-left: 20px; font-weight: 500; }
        .container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        h2 { color: #0f172a; margin-bottom: 6px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        .btn-add { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f8fafc; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #2563eb; }
        .task-item.done { opacity: 0.6; text-decoration: line-through; border-left-color: #10b981; }
        .btn-toggle { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🏥 MediQueue Pro</div>
        <div>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/dashboard">Live Dashboard</a>
            <a href="/tasks">React Tasks</a>
            <a href="/register">Register</a>
        </div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        function TaskManager() {
            const [tasks, setTasks] = React.useState([
                { id: 1, text: "Review Cardiology Emergency Reports", done: false },
                { id: 2, text: "Verify Morning OPD Doctor Shift", done: true },
                { id: 3, text: "Prepare Discharge Summary for #MQ-1", done: false }
            ]);
            const [input, setInput] = React.useState("");

            const addTask = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                setTasks([...tasks, { id: Date.now(), text: input, done: false }]);
                setInput("");
            };

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, done: !t.done } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            return (
                <div className="container">
                    <h2>⚛️ Doctor & Staff Daily Task Tracker</h2>
                    <p className="subtitle">Built with React 18 Component Architecture</p>
                    <form className="input-row" onSubmit={addTask}>
                        <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Add medical or administrative task..." />
                        <button type="submit" className="btn-add">+ Add Task</button>
                    </form>
                    {tasks.map(task => (
                        <div key={task.id} className={`task-item ${task.done ? 'done' : ''}`}>
                            <span>{task.text}</span>
                            <div>
                                <button className="btn-toggle" onClick={() => toggleTask(task.id)}>
                                    {task.done ? "Undo" : "✔ Done"}
                                </button>
                                <button className="btn-del" onClick={() => deleteTask(task.id)}>✖</button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TaskManager />);
    </script>
</body>
</html>
