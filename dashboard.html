<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hospital Dashboard - MediQueue</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; color: #1e293b; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0f172a, #1d4ed8); padding: 15px 40px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .navbar .logo { font-size: 24px; font-weight: bold; }
        .navbar a { color: #e2e8f0; text-decoration: none; margin-left: 20px; font-weight: 500; transition: 0.2s; }
        .navbar a:hover { color: #38bdf8; }
        .tv-link { background: #ef4444; color: white !important; padding: 6px 14px; border-radius: 20px; font-weight: bold !important; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .voice-indicator { background: #dbeafe; color: #1e40af; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }

        /* Top Analytics & Stats */
        .top-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
        .stats-column { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .stat-card { background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border-top: 5px solid #2563eb; display: flex; flex-direction: column; justify-content: center; }
        .stat-card.wait { border-top-color: #f59e0b; }
        .stat-card.done { border-top-color: #10b981; }
        .stat-card h4 { font-size: 13px; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card p { font-size: 32px; font-weight: bold; color: #0f172a; }

        .chart-card { background: white; padding: 15px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: center; max-height: 170px; }

        /* Controls */
        .control-panel { background: white; padding: 18px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
        .group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        input, select { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .btn-add { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background: #1d4ed8; }

        /* Table */
        .table-card { background: white; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; padding: 14px 18px; color: #475569; font-size: 14px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; }
        .emergency-row { background-color: #fef2f2 !important; }

        .token-badge { background: #e0f2fe; color: #0369a1; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-family: monospace; }
        .badge-emergency { background: #ef4444; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-waiting { background: #fef3c7; color: #b45309; }
        .status-consultation { background: #dbeafe; color: #1d4ed8; }
        .status-completed { background: #dcfce7; color: #15803d; }

        .btn-call { background: #8b5cf6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 4px; }
        .btn-call:hover { background: #7c3aed; }
        .btn-complete { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🏥 MediQueue Pro</div>
        <div>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/dashboard">Live Dashboard</a>
            <a href="/tasks">React Tasks</a>
            <a href="/register">Register</a>
            <a href="/tv" target="_blank" class="tv-link">📺 Open TV Display</a>
        </div>
    </div>

    <div class="container">
        <div class="header-bar">
            <h2>Smart Queue Command Center</h2>
            <span class="voice-indicator">🔊 AI Voice Announcer Ready</span>
        </div>

        <div class="top-grid">
            <div class="stats-column">
                <div class="stat-card">
                    <h4>Total Patients</h4>
                    <p id="totalCount">0</p>
                </div>
                <div class="stat-card wait">
                    <h4>In Queue</h4>
                    <p id="waitingCount">0</p>
                </div>
                <div class="stat-card done">
                    <h4>Completed</h4>
                    <p id="completedCount">0</p>
                </div>
            </div>
            <div class="chart-card">
                <canvas id="deptChart"></canvas>
            </div>
        </div>

        <div class="control-panel">
            <div class="group">
                <input type="text" id="patientName" placeholder="Patient Full Name...">
                <select id="department">
                    <option value="Cardiology">Cardiology</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Neurology">Neurology</option>
                </select>
                <select id="priority">
                    <option value="Normal">Normal Priority</option>
                    <option value="Emergency">🚨 Emergency</option>
                </select>
                <button class="btn-add" onclick="addAppointment()">+ Add Patient</button>
            </div>

            <div class="group">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Search name or token...">
                <select id="deptFilter" onchange="filterTable()">
                    <option value="ALL">All Departments</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Neurology">Neurology</option>
                </select>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Patient Name</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Smart Actions</th>
                    </tr>
                </thead>
                <tbody id="queueTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allAppointments = [];
        let deptChartInstance = null;

        async function loadAppointments() {
            const response = await fetch('/api/appointments');
            allAppointments = await response.json();
            updateStatsAndChart(allAppointments);
            renderTable(allAppointments);
        }

        function updateStatsAndChart(data) {
            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('waitingCount').innerText = data.filter(i => i.status !== 'Completed').length;
            document.getElementById('completedCount').innerText = data.filter(i => i.status === 'Completed').length;

            const depts = ['Cardiology', 'Medicine', 'Orthopedics', 'Neurology'];
            const counts = depts.map(d => data.filter(i => i.department === d).length);

            const ctx = document.getElementById('deptChart').getContext('2d');
            if (deptChartInstance) deptChartInstance.destroy();
            deptChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: depts,
                    datasets: [{
                        data: counts,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('queueTableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                let statusClass = 'status-waiting';
                if (item.status === 'Completed') statusClass = 'status-completed';
                else if (item.status === 'In Consultation') statusClass = 'status-consultation';

                const isEmergency = item.priority === 'Emergency';
                const rowClass = isEmergency && item.status !== 'Completed' ? 'emergency-row' : '';
                const emergencyTag = isEmergency ? `<span class="badge-emergency">🚨 EMERGENCY</span>` : '';

                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td><span class="token-badge">#MQ-${item.id}</span></td>
                        <td><strong>${item.patient_name}</strong> ${emergencyTag}</td>
                        <td>${item.department}</td>
                        <td><span class="status-badge ${statusClass}">${item.status}</span></td>
                        <td>
                            <button class="btn-call" onclick="callPatient(${item.id}, '${item.patient_name}', '${item.department}')">📢 Call</button>
                            <button class="btn-complete" onclick="completeAppointment(${item.id})">✔ Done</button>
                            <button class="btn-delete" onclick="deleteAppointment(${item.id})">✖</button>
                        </td>
                    </tr>
                `;
            });
        }

        // AI Voice Announcement Function
        async function callPatient(id, name, dept) {
            await fetch(`/api/appointments/${id}/call`, { method: 'PUT' });
            loadAppointments();

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = `Attention please! Token number M Q ${id}, ${name}, please proceed to ${dept} consultation room.`;
                const speech = new SpeechSynthesisUtterance(text);
                speech.rate = 0.95;
                speech.pitch = 1.05;
                window.speechSynthesis.speak(speech);
            }
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptFilter').value;
            const filtered = allAppointments.filter(item => {
                const matchesSearch = item.patient_name.toLowerCase().includes(search) || `#mq-${item.id}`.includes(search);
                const matchesDept = (dept === 'ALL') || (item.department === dept);
                return matchesSearch && matchesDept;
            });
            renderTable(filtered);
        }

        async function addAppointment() {
            const name = document.getElementById('patientName').value.trim();
            const dept = document.getElementById('department').value;
            const priority = document.getElementById('priority').value;
            if (!name) return alert("Enter patient name!");

            await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ patient_name: name, department: dept, priority: priority })
            });
            document.getElementById('patientName').value = '';
            loadAppointments();
        }

        async function completeAppointment(id) {
            await fetch(`/api/appointments/${id}`, { method: 'PUT' });
            loadAppointments();
        }

        async function deleteAppointment(id) {
            if (confirm("Remove patient from queue?")) {
                await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
                loadAppointments();
            }
        }

        loadAppointments();
    </script>
</body>
</html>
